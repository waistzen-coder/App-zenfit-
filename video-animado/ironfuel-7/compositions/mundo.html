    const pa = parp * ojo * (st.parpado ?? 1);
    e.ojoL.setAttribute("transform", `translate(${fx - 23} -8) scale(${f2(ojo)} ${f2(pa)})`);
    e.ojoR.setAttribute("transform", `translate(${fx + 23} -8) scale(${f2(ojo)} ${f2(pa)})`);
    e.pupL.setAttribute("cx", f2(lx));
    e.pupL.setAttribute("cy", f2(ly));
    e.pupR.setAttribute("cx", f2(lx));
    e.pupR.setAttribute("cy", f2(ly));
    const g = st.gesto;
    e.cejaL.setAttribute("transform", `translate(${fx - 23} ${f2(-36 + g.cy)}) rotate(${f2(-g.cr)})`);
    e.cejaR.setAttribute("transform", `translate(${fx + 23} ${f2(-36 + g.cy + (st.cejaR || 0))}) rotate(${f2(g.cr)})`);
    const habla = st.habla ? Math.abs(Math.sin(t * TAU * 3.1 + p.seed)) * 12 : 0;
    const mo = g.mo + habla;
    e.boca.setAttribute(
      "d",
      `M${f2(-g.mw / 2)} 0Q0 ${f2(g.mc)} ${f2(g.mw / 2)} 0Q0 ${f2(g.mc + mo)} ${f2(-g.mw / 2)} 0Z`,
    );
    e.boca.setAttribute("transform", `translate(${fx * 0.7} 32)`);
    if (e.pelo && p.coleta) e.pelo.setAttribute("transform", `rotate(${f2(Math.sin(fase * 0.5 + t * 2) * 8 * (0.3 + amp))} -40 -40)`);
    // dónde quedan las manos en el mundo (para los objetos que sujetan)
    const mano = (lado) => {
      const s = lado === "R" ? -1 : 1;
      const a = lado === "R" ? -aR + swA : aL + swA;
      const el = lado === "R" ? -pose.eR : pose.eL;
      const px = lado === "R" ? shX : -shX;
      const rot = (x, y, d) => {
        const r = rad(d);
        return [x * Math.cos(r) - y * Math.sin(r), x * Math.sin(r) + y * Math.cos(r)];
      };
      let [ex, ey] = rot(0, M.hum, a);
      let [hx, hy] = rot(0, M.ant + 2, a + el);
      let x = px + ex + hx,
        y = shY + ey + hy;
      // inclinación del tronco y respiración
      const lean = (st.lean || 0) + (st.correr ? 6 * amp : 0);
      y -= resp;
      [x, y] = (() => {
        const r = rad(lean);
        const yy = y - hipY;
        return [x * Math.cos(r) - yy * Math.sin(r), x * Math.sin(r) + yy * Math.cos(r) + hipY];
      })();
      x += temblor;
      y += bob + agache;
      void s;
      return aMundo(st, x, y);
    };
    return { manoL: mano("L"), manoR: mano("R"), alto: -headY + M.R, cabeza: aMundo(st, 0, headY) };
  }
  function parpadeo(t, seed) {
    // parpadea cada 2,6-4,2 s (determinista)
    const periodo = 2.6 + ((seed * 7) % 16) / 10;
    const fase = (t + seed * 0.37) % periodo;
    if (fase < 0.13) return Math.max(0.08, Math.abs(fase - 0.065) / 0.065);
    return 1;
  }
  // velocidad horizontal (para las piernas) a partir de los fotogramas clave de x
  function vel(keys, t) {
    return (K(t + 0.02, keys) - K(t - 0.02, keys)) / 0.04;
  }
  const P = (n) => POSES[n];
  const G = (n) => GESTOS[n];

  // ─────────────── coreografía de la séptima parte (glutamina) ───────────────
  const PUERTA = 2340;
  const SITIO = 1580; // delante del mostrador
  const GYM_X = 3440; // donde entrena el flaco
  const BOLSA_X = 3240; // donde deja la bolsa
  const BOTE_SUELO = 3300; // donde deja el bote en el gimnasio
  const SHAKER_SUELO = 3640; // donde deja el shaker en la semana ocho
  const mezclaP = (a, b, u) => {
    const o = {};
    for (const k in a) o[k] = lerp(a[k], b[k], u);
    return o;
  };
  const rep = (t, periodo, fase = 0) => EZ.s((Math.sin(((t + fase) * TAU) / periodo - Math.PI / 2) + 1) / 2);
  const SHAKER_POSE = { aL: 14, eL: 14, aR: 40, eR: 112 }; // el shaker en la mano, a la altura del pecho

  // ── el flaco ──
  const FXK = [
    [0, SITIO],
    [T.fue + 0.1, SITIO],
    [T.fue + 0.45, PUERTA, "i"],
    [T.semana1 - 0.05, GYM_X, "o"],
  ];
  const FCARA = [
    [0, -1],
    [T.fue, -1],
    [T.fue + 0.12, 1, "io"],
  ];
  function flaco(t) {
    const x = K(t, FXK),
      v = vel(FXK, t);
    let face = K(t, FCARA);
    const giro = Math.abs(face);
    face = face >= 0 ? 1 : -1;
    let pose = P("brazos"),
      gesto = G("ceja"),
      habla = false,
      cabeza = 0,
      lean = 0,
      mx = 0.8,
      my = 0.3;
    const correr = Math.abs(v) > 900;
    if (t < T.fue + 0.1) {
      // ¿toda la glutamina es igual? (dedo en la barbilla) · él creía que sí (asiente)
      pose = K(t, [
        [0, P("dedo")],
        [T.creia - 0.2, P("dedo")],
        [T.creia + 0.1, P("manos"), "back"],
        [T.ensenaron, P("manos")],
        [T.ensenaron + 0.3, P("brazos"), "io"],
      ]);
      if (t > T.creia - 0.1 && t < T.ensenaron) (gesto = G("sonrisa")), (cabeza = Math.sin((t - T.creia) * 10) * 6);
      if (t > T.esta) (gesto = G("wow")), (my = 0.3);
      if (t > T.sello1) (gesto = G("sonrisa")), (mx = 0.2), (my = -0.6);
      if (t > T.aminoacido) mx = 0.7;
      if (t > T.siempre1 - 0.1) (gesto = G("serio")), (mx = 0.4), (my = -1), (cabeza = t > T.entrenar1 && t < T.nada1 + 0.4 ? Math.sin((t - T.entrenar1) * 9) * 5 : 0);
      if (t > T.pago - 0.3) {
        gesto = G("sonrisa");
        pose = K(t, [
          [T.pago - 0.25, P("brazos")],
          [T.pago, P("pagar"), "io"],
          [T.pago + 0.4, P("pagar")],
          [T.pago + 0.65, P("bolsa"), "io"],
        ]);
      }
    } else if (t < T.semana1 - 0.05) {
      pose = P("bolsa");
      gesto = G("orgullo");
      lean = 6;
    } else {
      // en el gimnasio
      face = 1;
      mx = 0.9;
      my = 0;
      gesto = G("sonrisa");
      if (t < T.semana3) {
        // el shaker de siempre; con «batido», lo agita
        const agita = t > T.batido2 && t < T.batido2 + 0.8 ? Math.sin((t - T.batido2) * 40) * 18 : 0;
        pose = mezclaP(P("brazos"), { ...SHAKER_POSE, aR: SHAKER_POSE.aR + agita }, pr(t, T.semana1, 0.3));
        if (t > T.pregunto) mx = 1;
        if (t > T.nada2 - 0.1) {
          pose = K(t, [
            [T.nada2 - 0.1, { ...SHAKER_POSE }],
            [T.nada2 + 0.15, { aL: 60, eL: -30, aR: 40, eR: 112 }, "back"],
          ]);
          gesto = G("orgullo");
        }
      } else {
        // semana ocho: enseña el bote; todos miran la etiqueta
        pose = mezclaP(P("brazos"), P("suplica"), pr(t, T.medio - 0.3, 0.3));
        gesto = G("orgullo");
        mx = 0;
        my = 0.3;
      }
    }
    const sq = 0.88 + 0.12 * giro;
    return { x, y: SUELO, s: 1.04, face, sqx: sq, m: 1, v, pose, gesto, habla, cabeza, lean, mx, my, correr };
  }
  // ── los del gimnasio: el compañero (semana cuatro) y los demás (semana ocho) ──
  const LLEGA = { comp: [4480, 3800, "semana2"], gym: [4520, 3930, "semana3"], vec: [4600, 4110, "semana3"], abu: [2860, 3170, "semana3"] };
  function delGym(id, t) {
    const [x0, x1, k] = LLEGA[id];
    const XK = [
      [0, x0],
      [T[k], x0],
      [T[k] + 0.7, x1, "o"],
    ];
    const x = K(t, XK),
      v = vel(XK, t);
    const face = id === "abu" ? 1 : -1;
    let pose = P("brazos"),
      gesto = G("sonrisa"),
      habla = false,
      lean = 0,
      my = 0;
    if (id === "comp" && t > T.pregunto - 0.1 && t < T.semana3) {
      habla = t < T.nada2 - 0.1;
      pose = K(t, [
        [T.pregunto - 0.1, P("brazos")],
        [T.pregunto + 0.2, P("explica"), "back"],
      ]);
      gesto = t > T.nada2 ? G("wow") : G("ceja");
    }
    if (t > T.medio - 0.2) {
      // se inclinan a mirar la etiqueta
      lean = (id === "abu" ? 1 : -1) * 8 * pr(t, T.medio - 0.2, 0.4);
      gesto = G("wow");
      my = 0.5;
      pose = K(t, [
        [T.medio - 0.2, P("brazos")],
        [T.medio + 0.2, P("suplica"), "back"],
      ]);
    }
    const s = id === "abu" ? 0.9 : id === "vec" ? 0.95 : 1;
    const m = id === "gym" ? 0.85 : PJ[id].m0;
    return { x, y: SUELO, s, face, m, v, pose, gesto, habla, lean, mx: 0.9, my, oculto: t < T[k] - 0.1 };
  }

  function dependiente(t) {
    let pose = P("reposo"),
      gesto = G("sonrisa"),
      habla = false,
      lean = 0,
      mx = 0.8,
      my = 0.4;
    // aparta los botes sin marca y saca el bueno
    if (t > T.ensenaron - 0.2 && t < T.sello1)
      pose = K(t, [
        [T.ensenaron - 0.2, P("reposo")],
        [T.ensenaron + 0.1, P("manos"), "io"],
        [T.esta - 0.1, P("manos")],
        [T.esta + 0.15, P("senala"), "back"],
      ]);
    if (t > T.esta) gesto = G("orgullo");
    if (t > T.sello1) (mx = -0.2), (my = 0.4);
    if (t > T.aminoacido) mx = 0.6;
    if (t > T.siempre1 - 0.25) {
      gesto = G("serio");
      habla = t < T.nada1 + 0.4;
      lean = K(t, [
        [T.siempre1 - 0.25, 0],
        [T.siempre1 + 0.1, 9, "io"],
        [T.nada1 + 0.4, 9],
        [T.nada1 + 0.7, 0, "io"],
      ]);
      pose = K(t, [
        [T.siempre1 - 0.25, P("reposo")],
        [T.siempre1 + 0.1, P("explica"), "back"],
        [T.nada1 + 0.4, P("explica")],
        [T.nada1 + 0.7, P("reposo"), "io"],
      ]);
      mx = 1;
    }
    if (t > T.pago - 0.35) {
      gesto = G("sonrisa");
      habla = false;
      pose = K(t, [
        [T.pago - 0.35, P("reposo")],
        [T.pago - 0.05, P("pagar"), "io"],
        [T.pago + 0.45, P("pagar")],
        [T.pago + 0.8, P("reposo"), "io"],
        [T.siguenos - 0.2, P("reposo")],
        [T.siguenos + 0.15, P("flexR"), "back"],
      ]);
    }
    return { x: 1000, y: SUELO, s: 1.04, face: 1, m: 0.78, v: 0, pose, gesto, habla, lean, mx, my };
  }

// ─────────────── objetos del mundo ───────────────
  function setOp(el, o) {
    el.setAttribute("opacity", f2(o));
  }
  function popEl(el, t, t0, cx, cy, d) {
    const p = pop(t, t0, d);
    el.setAttribute("transform", `translate(${cx} ${cy}) scale(${f2(p.s)}) translate(${-cx} ${-cy})`);
    setOp(el, p.o);
    return p;
  }
  function escribir(el, texto, t, t0, t1) {
    const n = Math.round(clamp((t - t0) / Math.max(0.05, t1 - t0)) * texto.length);
    const v = texto.slice(0, n);
    if (el.textContent !== v) el.textContent = v;
  }
  function barra(el, t, mano1, mano2, flex, discos) {
    // barra entre las dos manos; flex = cuánto se dobla (0-1)
    const cx = (mano1.x + mano2.x) / 2,
      cy = (mano1.y + mano2.y) / 2;
    el.root.setAttribute("transform", `translate(${f2(cx)} ${f2(cy)})`);
    const L = 300,
      caida = 70 * flex;
    el.bar.setAttribute("d", `M${-L} ${f2(caida)}Q0 ${f2(-caida * 1.2)} ${L} ${f2(caida)}`);
    discos.forEach((d, i) => {
      const lado = i % 2 === 0 ? -1 : 1;
      const k = Math.floor(i / 2);
      const x = lado * (L - 40 - k * 34);
      const y = caida * 0.9 - (flex ? 6 * k * flex : 0);
      el.discos[i].setAttribute(
        "transform",
        `translate(${f2(d.x ?? x)} ${f2(d.y ?? y)}) rotate(${f2(lado * flex * 12)}) scale(${f2(d.s)})`,
      );
      setOp(el.discos[i], d.o);
    });
  }

  // ─────────────── kit común: tarjetas por datos (partes 6 en adelante) ───────────────
  const CARDS = window.__IF.CARDS || [];
  const tk = (k) => (Array.isArray(k) ? T[k[0]] + k[1] : T[k]);
  const RC = {};
  function initTarjetas() {
    for (const c of CARDS) {
      RC[c.id] = { card: $(c.id), fondo: $(c.id + "-fondo"), filas: c.filas.map((f) => $(f.id)) };
      // alturas: la tarjeta crece en su sitio cuando aparece una fila que queda por debajo
      const filas = [...c.filas].sort((a, b) => tk(a.t) - tk(b.t));
      const keys = [[0, c.h0]];
      let h = c.h0,
        fin = 0;
      for (const f of filas) {
        const nh = Math.max(h, f.abajo - c.y + 26);
        if (nh > h) {
          const a = Math.max(tk(f.t) - 0.08, fin);
          fin = Math.max(tk(f.t) + 0.25, a + 0.12);
          keys.push([a, h], [fin, nh, "backS"]);
          h = nh;
        }
      }
      RC[c.id].alturas = keys;
    }
  }
  function tarjetas(t) {
    for (const c of CARDS) {
      const r = RC[c.id];
      popEl(r.card, t, tk(c.t0) - 0.05, c.x + c.w / 2, c.y + 50, 0.4);
      r.fondo.setAttribute("height", f2(K(t, r.alturas)));
      c.filas.forEach((f, i) => popEl(r.filas[i], t, tk(f.t), f.cx, f.cy, 0.35));
    }
  }

  // ─────────────── referencias ───────────────
  let R = null;
  function init() {
    for (const id of Object.keys(PJ)) initPJ(id);
    initTarjetas();
    R = {
      svg: $("mundo-svg"), cam: $("cam"), fondo: $("fondo-lejano"),
      puerta: $("puerta-hoja"), neonTienda: $("neon-tienda"), reflejo: $("reflejo"), bocadillo: $("bocadillo"),
      magiaColor: $("magia-color"), magiaGris: $("magia-gris"), magiaChispas: $("magia-chispas"), magiaX: $("magia-x"),
      gen: [1, 2, 3].map((i) => $("gen-" + i)), igual: [1, 2].map((i) => $("igual-" + i)),
      capaBotes: $("capa-botes"), capaFrente: $("capa-frente"), pt: $("bote-pt"), subPt: $("sub-pt"), sello: $("sello-kq"),
      shaker: $("shaker"), cacito: $("cacito"), polvoCacito: $("polvo-cacito"), polvoCae: $("polvo-cae"),
      pSabe: $("p-sabe"), pNada: $("p-nada"), pSello: $("p-sello"), lupa: $("lupa"),
      seguir: $("seguir"), chipP2: $("chip-p2"), chipP3: $("chip-p3"), botonFondo: $("boton-fondo"),
      botonSeguir: $("boton-seguir-txt"), botonSiguiendo: $("boton-siguiendo"), dedo: $("dedo-tap"),
      datafono: $("datafono"), datPantalla: $("datafono-ok"), movil: $("movil"), bolsa: $("bolsa"), bolsaAbu: $("bolsa-abu"),
      pila: $("pila"), estelas: $("estelas"), baston: $("baston"), gotas: $("gotas"), choque: $("choque"),
      neonGym: $("neon-gym"), neonGymOff: $("neon-gym-off"), luces: [0, 1, 2, 3].map((i) => $("luz-g" + i)), oscuro: $("gym-oscuro"),
      marcadorU: $("marcador-u"), marcadorD: $("marcador-d"),
      lineaBrillo: $("linea-brillo"), lineaIda: $("linea-ida"),
      barraF: $("barra-flaco"), barraV: $("barra-vecino"),

  }

  // ─────────────── render(t) ───────────────
  function render(t) {
    if (!R) init();
    const c = camara(t);
    const tx = CX - c.x * c.z + c.sx,
      ty = CY - c.y * c.z + c.sy;
    R.cam.setAttribute("transform", `translate(${f2(tx)} ${f2(ty)}) scale(${c.z.toFixed(4)})`);
    const zf = 0.55 + c.z * 0.25;
    R.fondo.setAttribute("transform", `translate(${f2(CX - c.x * 0.3 * zf)} ${f2(CY - (c.y - 400) * 0.3 * zf - 600 * zf)}) scale(${f2(zf)})`);
    const c2 = camara(t - 1 / 30);
    const desp = Math.hypot((c.x - c2.x) * c.z, (c.y - c2.y) * c.z);
    const blur = clamp((desp - 26) / 10, 0, 4);
    R.svg.style.filter = blur > 0.25 ? `blur(${blur.toFixed(2)}px)` : "none";

    // ── personajes ──
    const sf = flaco(t);
    const hf = dibujarPJ("flaco", sf, t);
    const sd = dependiente(t);
    const hd = dibujarPJ("dep", sd, t);
    const hc = dibujarPJ("comp", delGym("comp", t), t);
    dibujarPJ("gym", delGym("gym", t), t);
    dibujarPJ("vec", delGym("vec", t), t);
    dibujarPJ("abu", delGym("abu", t), t);
    for (const el of [R.baston, R.bolsaAbu, R.pila, R.choque, R.gotas, R.bocadillo, R.barraF, R.barraV]) setOp(el, 0);
    // bolsa: en la mano tras pagar; en el gimnasio, en el suelo
    const bolsaEn = (() => {
      const u = pr(t, T.semana1 - 0.05, 0.25, EZ.io);
      return { x: lerp(hf.manoL.x, BOLSA_X, u), y: lerp(hf.manoL.y, SUELO - 150, u) - Math.sin(u * Math.PI) * 30 };
    })();
    {
      const pb = pop(t, T.pago + 0.4, 0.35);
      R.bolsa.setAttribute("transform", `translate(${f2(bolsaEn.x)} ${f2(bolsaEn.y)}) scale(${f2(pb.s)})`);
      setOp(R.bolsa, pb.o);
    }
    R.estelas.setAttribute("transform", `translate(${f2(sf.x - sf.face * 140)} ${SUELO - 300}) scale(${-sf.face} 1)`);
    setOp(R.estelas, clamp((Math.abs(sf.v) - 900) / 700) * 0.9);

    // ── «¿toda la glutamina es igual?»: tres botes sin marca ──
    R.gen.forEach((el, i) => {
      const p = pop(t, T.glutamina1 + i * 0.08, 0.3);
      let dx = 0,
        sx = 1,
        o = p.o;
      if (i !== 1) {
        // los de los lados se apartan
        const u = pr(t, T.ensenaron, 0.35, EZ.i);
        dx = (i === 0 ? -1 : 1) * 170 * u;
        o *= 1 - u;
      } else {
        // el del medio da la vuelta… y es Pro Tella
        sx = 1 - pr(t, T.esta - 0.15, 0.15, EZ.i);
        if (t >= T.esta) o = 0;
      }
      const cx = [660, 900, 1140][i];
      el.setAttribute("transform", `translate(${f2(cx + dx)} 1470) scale(${f2(p.s * sx)} ${f2(p.s)}) translate(${-cx} -1470)`);
      setOp(el, o);
    });
    R.igual.forEach((el, i) => {
      const p = popEl(el, t, T.igual + i * 0.06, [780, 1020][i], 1330, 0.3);
      setOp(el, p.o * (1 - pr(t, T.ensenaron, 0.25)));
    });

    // ── Pro Tella: aparece en el mostrador, va a la bolsa, al suelo del gimnasio y a sus manos ──
    let pt = { x: 900, y: 1470, s: 1, o: 0 };
    if (t >= T.esta) {
      const u = pr(t, T.esta, 0.18, EZ.back);
      pt = { x: 900, y: 1470, s: 1, sx: u, o: 1 };
      const b = pr(t, T.pago + 0.45, 0.45, EZ.io);
      if (b > 0) {
        pt.x = lerp(900, hf.manoL.x, b);
        pt.y = lerp(1470, hf.manoL.y + 60, b) - Math.sin(b * Math.PI) * 220;
        pt.s = lerp(1, 0.25, b);
        pt.o = b > 0.92 ? 0 : 1;
      }
      const f = pr(t, T.semana1 + 0.1, 0.35, EZ.o);
      if (f > 0) {
        pt.x = lerp(bolsaEn.x, BOTE_SUELO, f);
        pt.y = lerp(bolsaEn.y + 40, SUELO, f) - Math.sin(f * Math.PI) * 120;
        pt.s = lerp(0.25, 0.6, f);
        pt.o = 1;
      }
      const m = pr(t, T.medio - 0.35, 0.35, EZ.io);
      if (m > 0) {
        const hx = (hf.manoL.x + hf.manoR.x) / 2,
          hy = (hf.manoL.y + hf.manoR.y) / 2 + 66;
        pt.x = lerp(BOTE_SUELO, hx, m);
        pt.y = lerp(SUELO, hy, m) - Math.sin(m * Math.PI) * 80;
      }
    }
    {
      const capa = t > T.semana1 ? R.capaFrente : R.capaBotes;
      if (R.pt.parentNode !== capa) capa.appendChild(R.pt);
      R.pt.setAttribute("transform", `translate(${f2(pt.x)} ${f2(pt.y)}) scale(${f2(pt.s * (pt.sx ?? 1))} ${f2(pt.s)})`);
      setOp(R.pt, pt.o);
      R.subPt.setAttribute("transform", `scale(${f2(pr(t, T.protela, 0.4, EZ.o))} 1)`);
      // el sello, pegado en el bote
      const ps = pop(t, T.sello1, 0.35);
      R.sello.setAttribute("transform", `translate(${f2(pt.x + 70 * pt.s)} ${f2(pt.y - 160 * pt.s)}) scale(${f2(ps.s * pt.s * (pt.sx ?? 1))})`);
      setOp(R.sello, ps.o * pt.o);
      // lupa y sello grande en la semana ocho
      const pl = pop(t, T.etiqueta, 0.3);
      R.lupa.setAttribute("transform", `translate(${f2(pt.x + 30 + Math.sin(t * 3) * 20)} ${f2(pt.y - 70 + Math.cos(t * 2.4) * 10)}) scale(${f2(pl.s * 0.8)})`);
      setOp(R.lupa, pl.o * popOut(t, T.fijate + 0.2));
      const pg = pop(t, T.sello2, 0.35);
      R.pSello.setAttribute("transform", `translate(${f2(pt.x)} ${f2(pt.y + 86)}) scale(${f2(pg.s * 0.8)})`);
      setOp(R.pSello, pg.o * popOut(t, T.comprarFin + 0.3));
    }

    // ── shaker y cacito ──
    {
      const ps = pop(t, T.semana1 + 0.15, 0.3);
      const baja = pr(t, T.semana3, 0.3, EZ.io);
      const enMano = { x: hf.manoR.x, y: hf.manoR.y + 70 };
      const sx = lerp(enMano.x, SHAKER_SUELO, baja),
        sy = lerp(enMano.y, SUELO, baja);
      const rot = t > T.batido2 && t < T.batido2 + 0.8 ? Math.sin((t - T.batido2) * 40) * 12 : 0;
      R.shaker.setAttribute("transform", `translate(${f2(sx)} ${f2(sy)}) rotate(${f2(rot)}) scale(${f2(ps.s * 0.8)})`);
      setOp(R.shaker, ps.o);
      // el cacito va del bote al shaker y lo vuelca con «echaba»
      const ida = pr(t, T.echaba - 0.4, 0.4, EZ.io);
      const boca = { x: enMano.x, y: enMano.y - 210 * 0.8 - 40 };
      const cx = lerp(BOTE_SUELO, boca.x - 30, ida),
        cy = lerp(SUELO - 140, boca.y, ida) - Math.sin(ida * Math.PI) * 90;
      const vuelca = pr(t, T.echaba, 0.25, EZ.o);
      R.cacito.setAttribute("transform", `translate(${f2(cx)} ${f2(cy)}) rotate(${f2(-110 * vuelca)}) scale(0.9)`);
      setOp(R.cacito, (t > T.echaba - 0.4 ? 1 : 0) * (1 - pr(t, T.echaba + 0.6, 0.25)));
      setOp(R.polvoCacito, 1 - vuelca);
      const cae = pr(t, T.echaba + 0.05, 0.5, EZ.lin);
      R.polvoCae.setAttribute("transform", `translate(${f2(boca.x - 10)} ${f2(boca.y + 10 + cae * 40)})`);
      setOp(R.polvoCae, cae > 0 && cae < 1 ? 0.9 : 0);
    }
    // ── píldoras ──
    const encima = (el, h, s, t0, t1, dx = 0) => {
      const p = pop(t, t0, 0.35);
      el.setAttribute("transform", `translate(${f2(h.cabeza.x + dx)} ${f2(h.cabeza.y - 66 * s - 100)}) scale(${f2(p.s)})`);
      setOp(el, p.o * popOut(t, t1));
    };
    encima(R.pSabe, hc, 1, T.pregunto, T.semana3, 60);
    encima(R.pNada, hf, 1.04, T.nada2, T.semana3 + 0.2, -60);

    // ── tienda ──
    const cerca = (x) => clamp(1 - (Math.abs(x - PUERTA) - 60) / 140);
    const abierta = Math.abs(sf.v) > 30 ? cerca(sf.x) : 0;
    R.puerta.setAttribute("transform", `translate(2470 0) scale(${f2(1 - 0.82 * EZ.o(abierta))} 1) translate(-2470 0)`);
    setOp(R.neonTienda, clamp(0.85 + 0.15 * Math.sin(t * 2.1) + (t > T.siguenos ? 0.2 : 0), 0, 1));
    setOp(R.reflejo, 0.5 - 0.3 * clamp((c.z - 0.9) / 0.6));
    setOp(R.magiaColor, 0);
    setOp(R.magiaGris, 1);
    setOp(R.magiaChispas, 0);
    setOp(R.magiaX, 1);

    // ── tarjetas ──
    tarjetas(t);

    // ── pagar ──
    {
      const pd = pr(t, T.pago - 0.3, 0.3, EZ.o) * (1 - pr(t, T.pago + 0.75, 0.3, EZ.i));
      R.datafono.setAttribute("transform", `translate(${f2(hd.manoR.x)} ${f2(hd.manoR.y)}) scale(${f2(pd)})`);
      setOp(R.datafono, pd > 0.02 ? 1 : 0);
      setOp(R.datPantalla, pr(t, T.pago, 0.15));
      const pm = pr(t, T.pago - 0.25, 0.25, EZ.o) * (1 - pr(t, T.pago + 0.45, 0.25, EZ.i));
      R.movil.setAttribute("transform", `translate(${f2(hf.manoR.x)} ${f2(hf.manoR.y)}) scale(${f2(pm)})`);
      setOp(R.movil, pm > 0.02 ? 1 : 0);
      const L2 = R.lineaIda.__len;
      setOp(R.lineaBrillo, 0);
      const vuelve = t > T.fue && t < T.semana1 + 0.6;
      R.lineaIda.setAttribute("stroke-dashoffset", f2(L2 * (1 - (vuelve ? clamp((sf.x - 1640) / 1810) : 0))));
      setOp(R.lineaIda, vuelve ? 1 - pr(t, T.semana1, 0.6) : 0);
    }

    // ── gimnasio ──
    {
      const semana = K(t, [
        [T.uno - 0.02, 12],
        [T.uno + 0.45, 1, "io"],
        [T.cuatro - 0.05, 1],
        [T.cuatro + 0.4, 4, "io"],
        [T.ocho1 - 0.05, 4],
        [T.ocho1 + 0.4, 8, "io"],
      ]);
      const decenas = semana < 9 ? 0 : semana >= 10 ? 1 : semana - 9;
      R.marcadorU.setAttribute("transform", `translate(0 ${f2(-semana * 150)})`);
      R.marcadorD.setAttribute("transform", `translate(0 ${f2(-decenas * 150)})`);
      for (const l of R.luces) setOp(l, 1);
      setOp(R.oscuro, 0);
      setOp(R.neonGym, 0.9 + 0.1 * Math.sin(t * 2.7));
      setOp(R.neonGymOff, 0);
    }

    // ── tarjeta final: seguir ──
    {
      popEl(R.seguir, t, T.siguenos, 1460, 280, 0.45);
      popEl(R.chipP2, t, T.siguenos + 0.15, 830, 370, 0.35);
      popEl(R.chipP3, t, T.ocho2, 1350, 370, 0.35);
      const pulsa = pr(t, T.perderte, 0.2, EZ.o);
      R.botonFondo.setAttribute("fill", mezclaColor("#1D6BFF", "#E5E7EB", pulsa));
      setOp(R.botonSeguir, 1 - pulsa);
      setOp(R.botonSiguiendo, pulsa);
      const llega = pr(t, T.perderte - 0.4, 0.38, EZ.io);
      const toque = t > T.perderte - 0.02 && t < T.perderte + 0.25 ? 1 - 0.18 * Math.sin(((t - T.perderte + 0.02) / 0.27) * Math.PI) : 1;
      R.dedo.setAttribute("transform", `translate(${f2(lerp(2360, 2010, llega))} ${f2(lerp(660, 450, llega))}) scale(${f2(toque)})`);
      setOp(R.dedo, pr(t, T.perderte - 0.4, 0.15) * (1 - pr(t, T.perderte + 0.6, 0.3)));
    }
  }
  function bocadilloPath(x, y, w, h) {
    const r = 40,
      tx = x + w * 0.62,
      b = y + h;
    return `M${x + r} ${y}H${x + w - r}Q${x + w} ${y} ${x + w} ${y + r}V${b - r}Q${x + w} ${b} ${x + w - r} ${b}H${tx + 40}L${tx + 10} ${b + 54}L${tx - 20} ${b}H${x + r}Q${x} ${b} ${x} ${b - r}V${y + r}Q${x} ${y} ${x + r} ${y}Z`;
  }
  function mezclaColor(a, b, u) {
    const pa = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16));
    const pb = [1, 3, 5].map((i) => parseInt(b.slice(i, i + 2), 16));
    const c = pa.map((v, i) => Math.round(lerp(v, pb[i], u)));
    return `rgb(${c.join(",")})`;
  }

  // longitudes de los trazos que se dibujan
  function medirTrazos() {
    for (const id of ["linea-suelo", "linea-brillo", "linea-ida"]) {
      const el = document.getElementById(id);
      el.__len = el.getTotalLength();
      el.setAttribute("stroke-dasharray", `${el.__len} ${el.__len}`);
    }
  }

  window.__IF.render = render;
  window.__IF.medir = medirTrazos;
  window.__IF.camara = camara;
})();
window.__IF.medir();
(function () {
  const D = window.__IF.D;
  const tl = gsap.timeline({ paused: true });
  // el reloj: GSAP mueve t y cada valor de t pinta su fotograma
  const reloj = {
    _t: 0,
    get t() { return this._t; },
    set t(v) { this._t = v; window.__IF.render(v); },
  };
  tl.fromTo(reloj, { t: 0 }, { t: D, duration: D, ease: "none" }, 0);
  window.__timelines = window.__timelines || {};
  window.__timelines["mundo"] = tl;
})();
</script>
</template>
